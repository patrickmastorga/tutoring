<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f2">
    {% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
    <title>{% if page.title %}{{ page.title | escape }}{% else %}Math, Made Clear{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Math, Made Clear home"><span class="brand-mark" aria-hidden="true">m<span>+</span></span><span class="brand-name">MATH, MADE CLEAR<small>PERSONAL TUTORING</small></span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation"><span></span><span></span><span class="sr-only">Menu</span></button>
        <nav class="navigation" id="primary-navigation" aria-label="Main navigation">
          <a href="#about">About</a><a href="#subjects">Subjects</a><a href="#how-it-works">How it works</a><a href="#rates">Rates</a>
          <a class="nav-contact" href="#contact">Let’s talk <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content">{{ content }}</main>
    {% include footer-scripts.html %}
  </body>
</html>
